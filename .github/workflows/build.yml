
name: Build ema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create new Android project
        run: |
          mkdir -p appsrc/app/src/main/java/com/ema/assistant

          cat > appsrc/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Ema"
          include(":app")
          EOF

          cat > appsrc/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > appsrc/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > appsrc/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ema.assistant'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ema.assistant'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > appsrc/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="емА"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > appsrc/app/src/main/java/com/ema/assistant/MainActivity.kt <<'EOF'
          package com.ema.assistant

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 32, 32, 32)
                      setBackgroundColor(Color.rgb(240, 244, 250))
                  }

                  val title = TextView(this).apply {
                      text = "Привет! Я емА"
                      textSize = 30f
                      setTextColor(Color.rgb(40, 60, 100))
                      gravity = Gravity.CENTER
                  }

                  val message = TextView(this).apply {
                      text = "Твой виртуальный помощник.\nЯ готова к работе!"
                      textSize = 18f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }

                  layout.addView(title)
                  layout.addView(message)
                  setContentView(layout)
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p appsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ema-apk
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
